[project]
name = "pre-nixos"
dynamic = ["version"]
description = "Pre-NixOS setup tool"
authors = [{name = "Unknown"}]
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["pre_nixos"]
include-package-data = true

[tool.setuptools.dynamic]
version = {file = "pre_nixos/VERSION"}

[tool.setuptools.package-data]
pre_nixos = [
    "root_key.pub",
    "VERSION",
    "default_log_file_path.txt",
    "scripts/announce-lan-ip.sh",
    "templates/auto-install-ip.nix",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pexpect>=4.9",
]

[project.scripts]
pre-nixos = "pre_nixos.pre_nixos:main"
pre-nixos-detect-storage = "pre_nixos.storage_detection:main"
pre-nixos-tui = "pre_nixos.tui:run"
pre-nixos-console = "pre_nixos.console:main"
pre-nixos-install-boot-files = "pre_nixos.boot_platform:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
# Strict type checking, ratcheted: every module listed here must pass
# `mypy --strict` (CI runs `mypy`).  Add modules as they become clean (task
# queue item 7 tracks the rest); imported, not-yet-listed modules are analysed
# for their types but their own errors are not reported.
strict = true
follow_imports = "silent"
# Check against the minimum declared Python (requires-python), not the
# interpreter running mypy.
python_version = "3.10"
files = [
  "pre_nixos/__init__.py",
  "pre_nixos/apply.py",
  "pre_nixos/block_names.py",
  "pre_nixos/boot_platform.py",
  "pre_nixos/inventory.py",
  "pre_nixos/logging_utils.py",
  "pre_nixos/network.py",
  "pre_nixos/partition.py",
  "pre_nixos/storage_detection.py",
]

[pytest]
markers =
    vm: marks VM integration tests that exercise the boot image in QEMU
    slow: marks slow-running scenarios that may take several minutes to complete
# VM sessions leave multi-GiB disk images in their tmp dirs; pytest's default
# of keeping 3 sessions filled the session's disk allowance twice (2026-10-18,
# 2026-10-19).  Keep only the latest session (verified: older dirs are removed).
tmp_path_retention_count = 1
